<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازی ریاضی پنجم</title>
<style>body{font-family:tahoma;background:#4fc3f7;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:20px;border-radius:16px;max-width:500px;width:90%;text-align:center}button,input{font-size:20px;padding:10px;margin:10px}</style></head><body><div class="box"><h2>بازی فصل اول ریاضی پنجم</h2><div id=q></div><input id=a><br><button onclick="c()">ثبت پاسخ</button><div id=r></div><div>امتیاز: <span id=s>0</span>/5</div></div><script>
const qs=[["عدد «سه میلیارد و بیست و پنج میلیون» را بنویس.","3025000000"],["۴۵۶۷۰۰۰ چند میلیون است؟","4"],["عدد مرکب ۳ میلیون و ۲۵ هزار را بنویس.","3025000"],["الگو را کامل کن: ۵،۱۰،۱۵،؟","20"],["عدد «۹ میلیارد و ۱۰» را بنویس.","9000000010"]];
let i=0,sc=0;q.innerText=qs[0][0];
function c(){if(a.value.trim()==qs[i][1]){sc++;r.innerHTML="✅ آفرین!"}else{r.innerHTML="❌ پاسخ درست: "+qs[i][1]}s.innerText=sc;i++;a.value="";if(i<qs.length){q.innerText=qs[i][0]}else{document.querySelector(".box").innerHTML="<h2>پایان بازی</h2><h3>امتیاز "+sc+" از 5</h3><button onclick='location.reload()'>دوباره</button>"}}</script></body></html>
